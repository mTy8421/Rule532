<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>เครื่องคิดเลขแบ่งเงินเดือน 50/30/20</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>แบ่งเงินเดือนแบบ 50/30/20</h1>
      <p class="subtitle">ช่วยวางแผนรายรับให้เป็นสัดส่วนอย่างง่าย</p>

      <label for="salary">เงินเดือนหรือรายรับทั้งหมด</label>
      <div class="input-wrap">
        <input
          id="salary"
          type="number"
          min="0"
          step="0.01"
          value="5000"
          inputmode="decimal"
          aria-describedby="summary"
        />
        <span class="unit">บาท</span>
      </div>

      <section class="results" aria-live="polite">
        <article class="card">
          <div class="percent">50%</div>
          <div class="purpose">ค่าใช้จ่ายจำเป็น</div>
          <div class="amount" id="needs">2,500 บาท</div>
        </article>
        <article class="card">
          <div class="percent">30%</div>
          <div class="purpose">ความต้องการส่วนตัว</div>
          <div class="amount" id="wants">1,500 บาท</div>
        </article>
        <article class="card">
          <div class="percent">20%</div>
          <div class="purpose">เงินออมและลงทุน</div>
          <div class="amount" id="savings">1,000 บาท</div>
        </article>
      </section>
      <p class="summary" id="summary">รวมทั้งหมด 5,000 บาท</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
